replicaCount: 1

image:
  repository: ghcr.io/iamgeorgezelenkov/m1core-audit-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8000

env:
  KEYCLOAK_ISSUER: ""
  WRITER_ROLE: audit-writer
  READER_ROLE: audit-reader
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: audit
  DB_USER: audit

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
